# >>> OUTLINE-SITES-BEGIN — gestionado por deploy/vps/{apply,sync}-host-caddy.sh
# >>> No editar a mano en /etc/caddy/Caddyfile: el sync lo pisa.
# ============================================================================
# Outline — sites para el Caddy del HOST (append a /etc/caddy/Caddyfile)
# Fusionar con:  sudo /opt/services/outline-service/deploy/vps/apply-host-caddy.sh
#
# El edge de esta caja es el Caddy NATIVO del host (systemd, ACME propia), que
# ya sirve 7 dominios. Este stack NO tiene servicio caddy: los upstreams
# publican en loopback y el host les hace reverse-proxy.
#
# Snippets propios (outline_*) — NO reusar (sec_common)/(proxy_headers) del host:
#   · el (proxy_headers) del host solo setea X-Real-IP y NO resetea XFF; el
#     rate-limiter de Outline lee XFF sin validar → spoofeable.
#   · el (sec_common) del host no trae HSTS.
# HSTS sin `preload` a propósito (no comprometer todo iridia.cloud).
# ============================================================================

# Headers de seguridad para Outline. OJO con lo que NO está acá:
#
#   · SIN Content-Security-Policy. Outline emite la suya con nonces por request
#     (server/middlewares/csp.ts). Dos headers CSP hacen que el navegador aplique
#     la INTERSECCIÓN de ambas políticas → la app se rompe. La CSP la manda la app.
#   · SIN X-Frame-Options. El sharing público de Outline necesita poder embeber
#     documentos; un DENY acá lo rompe. El control de framing lo hace la app vía
#     `frame-ancestors` en su propia CSP.
(outline_sec_headers) {
	header {
		Strict-Transport-Security "max-age=31536000; includeSubDomains"
		X-Content-Type-Options "nosniff"
		Referrer-Policy "strict-origin-when-cross-origin"
		Permissions-Policy "geolocation=(), microphone=(), camera=(), payment=(), usb=(), interest-cohort=()"
		-Server
		-X-Powered-By
	}
}

# Resetea XFF al peer TCP real (Caddy es el edge). El rate-limiter de Outline
# lo lee sin validar. No poner otro proxy delante sin revisar esto.
(outline_real_ip) {
	header_up X-Forwarded-For {remote_host}
	header_up X-Real-IP {remote_host}
}

# ─── Outline — app (Koa + WebSockets de colaboración) ────────────────────────
outline.iridia.cloud {
	encode gzip zstd
	import outline_sec_headers

	# Alineado con FILE_STORAGE_UPLOAD_MAX_SIZE (250 MB). Los uploads grandes van
	# directo a s3.iridia.cloud, no por acá — esto cubre imports de workspace.
	request_body {
		max_size 250MB
	}

	# WebSockets (y.js + socket.io) los maneja Caddy solo. flush_interval -1
	# desactiva el buffering de respuesta para que el canal en vivo no se atrase.
	reverse_proxy 127.0.0.1:3300 {
		import outline_real_ip
		flush_interval -1
	}

	log {
		output file /var/log/caddy/outline.access.log
	}
}

# ─── MinIO — API S3 de los adjuntos de Outline ───────────────────────────────
# Tiene que ser público: el navegador sube por presigned POST/PUT directo al
# bucket y descarga por redirect 302 a URL firmada. Un MinIO solo interno rompe
# todos los adjuntos.
#
# Superficie mínima: SOLO las rutas del bucket. Todo lo demás → 404. Eso deja
# afuera la consola (/minio/*), la API de administración y el listado del root.
# La consola queda en 127.0.0.1:9101, accesible solo por túnel SSH.
#
# Sin `encode`: el contenido ya viene comprimido o es binario, y recomprimir
# puede interferir con Content-Length y byte-ranges en las descargas firmadas.
s3.iridia.cloud {
	import outline_sec_headers

	request_body {
		max_size 250MB
	}

	# Allowlist estricto del bucket. Path-style: /outline (POST firmado) y
	# /outline/<key> (GET/PUT firmados). El preflight CORS cae en las mismas rutas.
	@bucket path /outline /outline/*
	handle @bucket {
		# Host NO se toca: SigV4 firma el header Host. Caddy lo preserva por
		# defecto — no agregar `header_up Host`, rompería todas las firmas.
		reverse_proxy 127.0.0.1:9100 {
			import outline_real_ip
		}
	}

	# Consola, API de admin, listado del root: no existen de cara a internet.
	handle {
		respond 404
	}

	log {
		output file /var/log/caddy/s3-outline.access.log
	}
}
# <<< OUTLINE-SITES-END
